<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Astitv</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
background:#0a0a0a;
color:white;
}

/* NAVBAR */
header{
display:flex;
justify-content:space-between;
padding:15px 50px;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
align-items:center;
position:sticky;
top:0;
z-index:1000;
}

header h2{color:gold;}

nav a{
color:white;
margin:0 15px;
text-decoration:none;
position:relative;
}

nav a span{
background:gold;
color:black;
padding:2px 8px;
border-radius:50%;
font-weight:bold;
font-size:14px;
}

/* CART */
.container{padding:50px;}

.cart-item{
display:flex;
align-items:center;
justify-content:space-between;
background:rgba(255,255,255,0.05);
margin:15px 0;
padding:15px;
border-radius:15px;
}

.cart-item img{
width:80px;
border-radius:10px;
}

.info{flex:1;margin-left:20px;}

.qty{
display:flex;
align-items:center;
gap:10px;
}

.qty button{
padding:6px 12px;
background:gold;
border:none;
cursor:pointer;
border-radius:8px;
}

.remove{
color:red;
cursor:pointer;
margin-left:20px;
}

/* SUMMARY */
.summary{
margin-top:30px;
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:15px;
}

.summary h2{color:gold;}

.checkout{
margin-top:20px;
width:100%;
padding:12px;
background:gold;
border:none;
cursor:pointer;
border-radius:30px;
}
</style>

</head>

<body>

<header>
<h2>ASTITV</h2>
<nav>
<a href="index.html">Home</a>
<a href="products.html">Products</a>
<a href="cart.html">
  Cart <span id="cartCount">0</span>
</a>
</nav>
</header>

<div class="container">
<h1>Your Cart 🛒</h1>

<div id="cartItems"></div>

<div class="summary">
<h2>Total Items: <span id="totalItems">0</span></h2>
<h2>Subtotal: ₹<span id="subtotal">0</span></h2>
<h2>Discount: ₹0</h2>
<h2>Total: ₹<span id="total">0</span></h2>

<button class="checkout" onclick="goCheckout()">Proceed to Checkout</button>
</div>
</div>

<script>

let API_URL = "https://script.google.com/macros/s/AKfycbwvUdn4OSiFy3JeJWPfM8ah_V6T3hBCl6nFxyEqy4ASn4F_9BucnH1CB8oSvadgrd1f/exec";

/* LOAD PRODUCTS FROM SHEET */
let productMap = {};

async function loadProducts(){
  let res = await fetch(API_URL + "?type=products");
  let data = await res.json();

  data.forEach(p=>{
    productMap[p[0]] = {
      price: Number(p[1]) || 0,
      img: p[3] || "https://via.placeholder.com/80"
    };
  });

  renderCart();
}

/* CART DATA */
let cartData = JSON.parse(localStorage.getItem("cart")) || [];
let cart = {};

cartData.forEach(item=>{
  cart[item] = (cart[item] || 0) + 1;
});

/* RENDER CART */
function renderCart(){
let container = document.getElementById("cartItems");
container.innerHTML = "";

let subtotal = 0;
let totalItems = 0;

for(let item in cart){

let data = productMap[item] || {price:0,img:"https://via.placeholder.com/80"};

let qty = cart[item];
let itemTotal = data.price * qty;

subtotal += itemTotal;
totalItems += qty;

container.innerHTML += `
<div class="cart-item">
<img src="${data.img}">
<div class="info">
<h3>${item}</h3>
<p>₹${data.price} × ${qty} = ₹${itemTotal}</p>
</div>

<div class="qty">
<button onclick="changeQty('${item}', -1)">-</button>
<span>${qty}</span>
<button onclick="changeQty('${item}', 1)">+</button>
</div>

<span class="remove" onclick="removeItem('${item}')">Remove</span>
</div>
`;
}

document.getElementById("subtotal").innerText = subtotal;
document.getElementById("total").innerText = subtotal;
document.getElementById("totalItems").innerText = totalItems;

updateCartCount();
}

/* CHANGE QTY */
function changeQty(item, change){
cart[item] += change;
if(cart[item] <= 0) delete cart[item];
updateStorage();
}

/* REMOVE ITEM */
function removeItem(item){
delete cart[item];
updateStorage();
}

/* UPDATE STORAGE */
function updateStorage(){
let newCart = [];

for(let item in cart){
for(let i=0;i<cart[item];i++){
newCart.push(item);
}
}

localStorage.setItem("cart", JSON.stringify(newCart));
renderCart();
}

/* CART COUNT */
function updateCartCount(){
let cartItems = JSON.parse(localStorage.getItem("cart")) || [];
document.getElementById("cartCount").innerText = cartItems.length;
}

/* CHECKOUT */
function goCheckout(){
window.location.href = "checkout.html";
}

/* INIT */
loadProducts();

</script>

</body>
</html>
