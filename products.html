<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - Astitv</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#0a0a0a;color:white;}

/* NAVBAR */
header{
display:flex;
justify-content:space-between;
padding:15px 50px;
background:rgba(0,0,0,0.6);
backdrop-filter:blur(10px);
}
header h2{color:gold;}
nav a{color:white;margin:0 15px;text-decoration:none;}

/* TOP BAR */
.top-bar{
display:flex;
justify-content:space-between;
padding:30px 50px;
flex-wrap:wrap;
gap:20px;
}
.search{padding:10px;width:250px;border-radius:20px;border:none;outline:none;}
.filter button{
padding:10px 20px;
margin:5px;
border:none;
border-radius:20px;
cursor:pointer;
background:#222;
color:white;
}
.filter button.active,
.filter button:hover{background:gold;color:black;}

/* PRODUCTS */
.grid{
display:grid;
grid-template-columns:repeat(4,1fr); /* 🔥 fixed layout */
gap:30px;
padding:30px 50px;
}

/* responsive */
@media(max-width:1000px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){
  .grid{
    grid-template-columns:repeat(1,1fr);
  }
}
.card{
background:rgba(255,255,255,0.05);
border-radius:20px;
overflow:hidden;
transition:0.4s;
}
.card:hover{
transform:translateY(-10px) scale(1.03);
box-shadow:0 0 30px rgba(255,215,0,0.3);
}

/* SLIDER */
.slider{
position:relative;
width:100%;
height:250px;
overflow:hidden;
}
.slide{
position:absolute;
width:100%;
height:100%;
object-fit:contain;   /* 🔥 full image dikhegi */
background:#000;      /* optional */
opacity:0;
transition:0.5s;
}
.slide.active{opacity:1;}

.prev,.next{
position:absolute;
top:50%;
transform:translateY(-50%);
background:rgba(0,0,0,0.5);
border:none;
color:white;
font-size:20px;
cursor:pointer;
padding:5px 10px;
}
.prev{left:10px;}
.next{right:10px;}

.content{padding:20px;}
.price{color:gold;margin:10px 0;}
.btn{
width:100%;
padding:10px;
background:gold;
border:none;
border-radius:20px;
cursor:pointer;
font-weight:bold;
}

/* MODAL */
#detailModal{
display:none;
position:fixed;
top:0; left:0;
width:100%; height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
z-index:2000;
padding:20px;
}
.modal-inner{
background:#111;
border-radius:20px;
max-width:800px;
width:100%;
padding:20px;
position:relative;
}
#closeModal{
position:absolute;
top:10px;
right:15px;
font-size:28px;
cursor:pointer;
}

/* MODAL SLIDER */
.modalSlider{
position:relative;
height:300px;
overflow:hidden;
margin-bottom:20px;
}
.modalSlide{
position:absolute;
width:100%;
height:100%;
object-fit:contain;
background:#000;
opacity:0;
transition:0.5s;
}
.modalSlide.active{opacity:1;}

.modal-inner{
display:flex;
gap:30px;
align-items:flex-start;
}

.modalSlider{
flex:1;
height:300px;
}

.modal-right{
flex:1;
display:flex;
flex-direction:column;
gap:10px;
}

</style>

</head>
<body>

<header>
<h2>ASTITV</h2>
<nav>
<a href="index.html">Home</a>
<a href="cart.html">Cart <span id="cartCount">0</span></a>
</nav>
</header>

<div class="top-bar">
<input type="text" id="search" class="search" placeholder="Search..." onkeyup="searchProduct()">
<div class="filter">
<button onclick="filterCategory('all')" class="active">All</button>
<button onclick="filterCategory('Pure Brass')">Pure Brass</button>
<button onclick="filterCategory('Gift Items')">Gift Items</button>
<button onclick="filterCategory('Idols')">Idols</button>
<button onclick="filterCategory('Pooja Essentials')">Pooja Essentials</button>
</div>
</div>

<div class="grid" id="productGrid"></div>

<!-- MODAL -->
<div id="detailModal">
<div class="modal-inner">
<span id="closeModal">&times;</span>

<!-- LEFT IMAGE -->
<div class="modalSlider" id="modalSlider"></div>

<!-- RIGHT DETAILS -->
<div class="modal-right">
  <h2 id="modalName"></h2>
  <p id="modalPrice"></p>
  <p id="modalCategory"></p>

  <hr>

  <div id="modalDetails"></div>

  <button class="btn" onclick="addToCart(document.getElementById('modalName').innerText)">
    Add to Cart
  </button>
</div>
</div>
</div>   <!-- ❗ modal-inner close -->
</div>   <!-- ❗ detailModal close -->

<script>
let products = [];
let allProducts = [];
let currentCategory = "all";
let modalIndex = 0;

/* FETCH */
async function fetchProducts(){
  let res = await fetch("https://script.google.com/macros/s/AKfycbwvUdn4OSiFy3JeJWPfM8ah_V6T3hBCl6nFxyEqy4ASn4F_9BucnH1CB8oSvadgrd1f/exec?type=products");
  allProducts = await res.json();
  products = [...allProducts];
  displayProducts();
}

/* DISPLAY */
function displayProducts(){
  let grid = document.getElementById("productGrid");
  grid.innerHTML = "";

  let searchVal = document.getElementById("search").value.toLowerCase();

  products.forEach((p,index)=>{

    let name = p[0];
    let price = p[1];

    // ✅ MULTIPLE CATEGORY SUPPORT
    let categoryList = (p[2] || "").toLowerCase().split(",").map(c => c.trim());

    // ✅ CATEGORY FILTER
    if(currentCategory != "all" && !categoryList.includes(currentCategory.toLowerCase())){
      return;
    }

    // ✅ SEARCH FILTER
    if(searchVal && !Object.values(p).join(" ").toLowerCase().includes(searchVal)){
      return;
    }

    let img1=p[3];
    let img2=p[4];
    let img3=p[5];

    grid.innerHTML+=`
    <div class="card">

      <div class="slider" id="slider${index}">
        <img src="${img1}" class="slide active">
        ${img2?`<img src="${img2}" class="slide">`:""}
        ${img3?`<img src="${img3}" class="slide">`:""}

        <button class="prev" onclick="changeSlide(${index},-1)">❮</button>
        <button class="next" onclick="changeSlide(${index},1)">❯</button>
      </div>

      <div class="content">
        <h3>${name}</h3>
        <p class="price">₹${price}</p>
        <button class="btn" onclick='showDetails(${JSON.stringify(p)})'>View Details</button>
      </div>

    </div>`;
  });
}

/* CATEGORY FILTER */
function filterCategory(cat){
  currentCategory = cat;

  document.querySelectorAll(".filter button").forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");

  products = [...allProducts];
  displayProducts();
}

/* SEARCH */
function searchProduct(){
  products = [...allProducts];
  displayProducts();
}

/* SLIDER */
function changeSlide(index,dir){
  let slides=document.querySelectorAll(`#slider${index} .slide`);
  let active=0;

  slides.forEach((s,i)=>{
    if(s.classList.contains("active")) active=i;
    s.classList.remove("active");
  });

  let next=(active+dir+slides.length)%slides.length;
  slides[next].classList.add("active");
}

/* MODAL */
function showDetails(p){

  let slider=document.getElementById("modalSlider");
  slider.innerHTML="";

  let imgs=[p[3],p[4],p[5]].filter(i=>i);

  imgs.forEach((img,i)=>{
    slider.innerHTML+=`<img src="${img}" class="modalSlide ${i==0?'active':''}">`;
  });

  slider.innerHTML+=`
  <button class="prev" onclick="changeModalSlide(-1)">❮</button>
  <button class="next" onclick="changeModalSlide(1)">❯</button>
  `;

  document.getElementById("modalName").innerText=p[0];
  document.getElementById("modalPrice").innerText="₹ "+p[1];
  document.getElementById("modalCategory").innerText=p[2];

  let details="";
  for(let i=6;i<=25;i++){
    if(p[i]) details+=`<p>${p[i]}</p>`;
  }
  document.getElementById("modalDetails").innerHTML=details;

  document.getElementById("detailModal").style.display="flex";
  modalIndex=0;
}

/* MODAL SLIDE */
function changeModalSlide(dir){
  let slides=document.querySelectorAll(".modalSlide");
  slides.forEach(s=>s.classList.remove("active"));

  modalIndex=(modalIndex+dir+slides.length)%slides.length;
  slides[modalIndex].classList.add("active");
}

/* CLOSE */
document.getElementById("closeModal").onclick=()=>{
  document.getElementById("detailModal").style.display="none";
}

window.onclick=(e)=>{
  if(e.target.id=="detailModal"){
    document.getElementById("detailModal").style.display="none";
  }
}

/* CART */
function updateCartCount(){
  let cart=JSON.parse(localStorage.getItem("cart"))||[];
  document.getElementById("cartCount").innerText=cart.length;
}
updateCartCount();

function addToCart(product){
  let cart=JSON.parse(localStorage.getItem("cart"))||[];
  cart.push(product);
  localStorage.setItem("cart",JSON.stringify(cart));
  updateCartCount();
  alert("Added to cart 🛒");
}

/* INIT */
fetchProducts();</script>

</body>
</html>
